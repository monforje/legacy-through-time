<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Магазин</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap">
<link rel="stylesheet" href="kit.css">
</head>
<body style="display:block">
<main data-screen-demo style="width:360px;max-width:100%;margin:0 auto">
  <!-- Переключатель состояний только для макета, в приложении его нет -->
  <div class="demo" role="group" aria-label="Состояние экрана">
    <button class="chip" data-set="normal" aria-pressed="true">Магазин</button>
    <button class="chip" data-set="loading" aria-pressed="false">Загрузка</button>
    <button class="chip" data-set="offline" aria-pressed="false">Нет сети</button>
  </div>


<div class="device"><div class="safe">
  <div class="topbar strip">
    <div class="pill pill-energy"><svg class="ico"><use href="icons.svg#i-energy"/></svg><span>2</span><button class="pill-plus" aria-label="Пополнить энергию"><svg class="ico"><use href="icons.svg#i-plus"/></svg></button></div>
    <div class="pill pill-gem"><svg class="ico"><use href="icons.svg#i-gem"/></svg><span>50</span><button class="pill-plus" aria-label="Пополнить алмазы"><svg class="ico"><use href="icons.svg#i-plus"/></svg></button></div>
    <a class="btn btn-icon" href="settings.html" aria-label="Настройки"><svg class="ico"><use href="icons.svg#i-gear"/></svg></a>
  </div>

  <div class="scroll">
    <div class="stack" data-s="normal">
    <article class="card card-best starter">
      <div class="card-title"><div class="head">Для начинающих</div></div>
      <div class="art"><svg class="ico"><use href="icons.svg#i-gift"/></svg></div>
      <div class="buy">
        <div class="amounts"><span class="amount"><svg class="ico-s" style="color:var(--gem)"><use href="icons.svg#i-gem"/></svg>100</span>
        <span class="amount"><svg class="ico-s" style="color:var(--energy)"><use href="icons.svg#i-energy"/></svg>5</span></div>
        <button class="btn btn-price" data-gain="gem:100 energy:5">6,99 $</button>
      </div>
    </article>

    <div class="segmented" role="tablist">
      <button role="tab" aria-selected="true" data-target="energy">Энергия</button>
      <button role="tab" aria-selected="false" data-target="gems">Алмазы</button>
    </div>

    <div class="stack" data-panel="energy">
      <article class="card card-best big">
      <div class="card-title"><div class="head">Лучшая выгода</div></div>
        <div class="art" style="color:var(--energy)"><svg class="ico"><use href="icons.svg#i-energy"/></svg></div>
        <div class="buy"><div class="amounts"><span class="amount"><svg class="ico-s" style="color:var(--energy)"><use href="icons.svg#i-energy"/></svg>30</span></div><button class="btn btn-price" data-gain="energy:30">19,99 $</button></div>
      </article>
      <div class="grid2">
        <div class="card card-product"><div class="art" style="color:var(--energy)"><svg class="ico"><use href="icons.svg#i-energy"/></svg></div><div class="amounts"><span class="amount"><svg class="ico-s" style="color:var(--energy)"><use href="icons.svg#i-energy"/></svg>15</span></div><button class="btn btn-price btn-block" data-gain="energy:15">10,99 $</button></div>
        <div class="card card-product"><div class="art" style="color:var(--energy)"><svg class="ico"><use href="icons.svg#i-energy"/></svg></div><div class="amounts"><span class="amount"><svg class="ico-s" style="color:var(--energy)"><use href="icons.svg#i-energy"/></svg>5</span></div><button class="btn btn-price btn-block" data-gain="energy:5">3,99 $</button></div>
      </div>
    </div>

    <div class="stack" data-panel="gems" hidden>
      <article class="card card-best big">
      <div class="card-title"><div class="head">Лучшая выгода</div></div>
        <div class="art"><svg class="ico"><use href="icons.svg#i-gem"/></svg></div>
        <div class="buy"><div class="amounts"><span class="amount"><svg class="ico-s" style="color:var(--gem)"><use href="icons.svg#i-gem"/></svg>270</span></div><button class="btn btn-price" data-gain="gem:270">19,99 $</button></div>
      </article>
      <div class="grid2">
        <div class="card card-product"><div class="art"><svg class="ico"><use href="icons.svg#i-gem"/></svg></div><div class="amounts"><span class="amount"><svg class="ico-s" style="color:var(--gem)"><use href="icons.svg#i-gem"/></svg>130</span></div><button class="btn btn-price btn-block" data-gain="gem:130">9,99 $</button></div>
        <div class="card card-product"><div class="art"><svg class="ico"><use href="icons.svg#i-gem"/></svg></div><div class="amounts"><span class="amount"><svg class="ico-s" style="color:var(--gem)"><use href="icons.svg#i-gem"/></svg>60</span></div><button class="btn btn-price btn-block" data-gain="gem:60">4,99 $</button></div>
      </div>
    </div>
    <p class="small" style="text-align:center">Покупки проходят через Google Play</p>
    </div>
    <div class="stack" data-s="loading" hidden aria-hidden="true">
      <div class="skeleton sk-card"></div>
      <div class="skeleton" style="height:52px;border-radius:999px"></div>
      <div class="skeleton sk-card"></div>
      <div class="grid2"><div class="skeleton sk-card"></div><div class="skeleton sk-card"></div></div>
    </div>
    <div class="state-box" data-s="offline" hidden>
      <svg class="ico ico-xl"><use href="icons.svg#i-cart"/></svg>
      <div class="head">Магазин недоступен</div>
      <p class="small">Проверьте соединение и попробуйте ещё раз</p>
      <button class="btn btn-primary" data-retry>Повторить</button>
    </div>
  </div>

  <div class="toast" id="shop-toast" role="status" hidden></div>
  <nav class="tabbar">
    <a class="tab" href="home.html" data-back><svg class="ico"><use href="icons.svg#i-back"/></svg>Назад</a>
    <a class="tab" href="shop.html" aria-current="page"><svg class="ico"><use href="icons.svg#i-cart"/></svg>Магазин</a>
    <button class="tab"><svg class="ico"><use href="icons.svg#i-receipt"/></svg>Покупки</button>
  </nav>
</div></div>
</main>
<script src="shell.js"></script>
</body>
</html>
