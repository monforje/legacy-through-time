<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Магазин</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap">
<link rel="stylesheet" href="kit.css">
</head>
<body style="display:block">
<main data-screen-demo style="width:360px;max-width:100%;margin:0 auto">
  <!-- Переключатель состояний только для макета, в приложении его нет -->
  <div class="demo" role="group" aria-label="Состояние экрана">
    <button class="chip" data-set="normal" aria-pressed="true">Магазин</button>
    <button class="chip" data-set="loading" aria-pressed="false">Загрузка</button>
    <button class="chip" data-set="offline" aria-pressed="false">Нет сети</button>
  </div>


<div class="device"><div class="safe">
  <div class="topbar strip">
    <div class="pill pill-energy"><img class="ico-3d" src="assets/energy.png" alt=""><span>2</span><button class="pill-plus" aria-label="Пополнить энергию"><img class="ico g" src="assets/g/plus.png" alt=""></button></div>
    <div class="pill pill-gem"><img class="ico-3d" src="assets/gem.png" alt=""><span>50</span><button class="pill-plus" aria-label="Пополнить алмазы"><img class="ico g" src="assets/g/plus.png" alt=""></button></div>
    <a class="btn btn-icon" href="settings.html" aria-label="Настройки"><img class="ico g" src="assets/g/gear.png" alt=""></a>
  </div>

  <div class="scroll">
    <div class="stack" data-s="normal">
    <article class="card card-best starter">
      <div class="card-title"><div class="head">Для начинающих</div></div>
      <div class="art"><img class="ico-3d" src="assets/gift.png" alt="" data-open="assets/gift-open.png"></div>
      <div class="buy">
        <div class="amounts"><span class="amount"><img class="ico-3d" src="assets/gem.png" alt="">100</span>
        <span class="amount"><img class="ico-3d" src="assets/energy.png" alt="">5</span></div>
        <button class="btn btn-price" data-gain="gem:100 energy:5">6,99 $</button>
      </div>
    </article>

    <div class="segmented" role="tablist">
      <button role="tab" aria-selected="true" data-target="energy">Энергия</button>
      <button role="tab" aria-selected="false" data-target="gems">Алмазы</button>
    </div>

    <div class="stack" data-panel="energy">
      <article class="card card-best big">
      <div class="card-title"><div class="head">Лучшая выгода</div></div>
        <div class="art" style="color:var(--energy)"><img class="ico-3d" src="assets/energy-pack-l.png" alt=""></div>
        <div class="buy"><div class="amounts"><span class="amount"><img class="ico-3d" src="assets/energy.png" alt="">30</span></div><button class="btn btn-price" data-gain="energy:30">19,99 $</button></div>
      </article>
      <div class="grid2">
        <div class="card card-product"><div class="art" style="color:var(--energy)"><img class="ico-3d" src="assets/energy-pack-s.png" alt=""></div><div class="amounts"><span class="amount"><img class="ico-3d" src="assets/energy.png" alt="">15</span></div><button class="btn btn-price btn-block" data-gain="energy:15">10,99 $</button></div>
        <div class="card card-product"><div class="art" style="color:var(--energy)"><img class="ico-3d" src="assets/energy-pack-s.png" alt=""></div><div class="amounts"><span class="amount"><img class="ico-3d" src="assets/energy.png" alt="">5</span></div><button class="btn btn-price btn-block" data-gain="energy:5">3,99 $</button></div>
      </div>
    </div>

    <div class="stack" data-panel="gems" hidden>
      <article class="card card-best big">
      <div class="card-title"><div class="head">Лучшая выгода</div></div>
        <div class="art"><img class="ico-3d" src="assets/gem-pack-l.png" alt=""></div>
        <div class="buy"><div class="amounts"><span class="amount"><img class="ico-3d" src="assets/gem.png" alt="">270</span></div><button class="btn btn-price" data-gain="gem:270">19,99 $</button></div>
      </article>
      <div class="grid2">
        <div class="card card-product"><div class="art"><img class="ico-3d" src="assets/gem-pack-s.png" alt=""></div><div class="amounts"><span class="amount"><img class="ico-3d" src="assets/gem.png" alt="">130</span></div><button class="btn btn-price btn-block" data-gain="gem:130">9,99 $</button></div>
        <div class="card card-product"><div class="art"><img class="ico-3d" src="assets/gem-pack-s.png" alt=""></div><div class="amounts"><span class="amount"><img class="ico-3d" src="assets/gem.png" alt="">60</span></div><button class="btn btn-price btn-block" data-gain="gem:60">4,99 $</button></div>
      </div>
    </div>
    <p class="small" style="text-align:center">Покупки проходят через Google Play</p>
    </div>
    <div class="stack" data-s="loading" hidden aria-hidden="true">
      <div class="skeleton sk-card"></div>
      <div class="skeleton" style="height:52px;border-radius:999px"></div>
      <div class="skeleton sk-card"></div>
      <div class="grid2"><div class="skeleton sk-card"></div><div class="skeleton sk-card"></div></div>
    </div>
    <div class="state-box" data-s="offline" hidden>
      <img class="ico-3d" src="assets/cart.png" alt="">
      <div class="head">Магазин недоступен</div>
      <p class="small">Проверьте соединение и попробуйте ещё раз</p>
      <button class="btn btn-primary" data-retry>Повторить</button>
    </div>
  </div>

  <div class="toast" id="shop-toast" role="status" hidden></div>
  <nav class="tabbar">
    <a class="tab" href="home.html" data-back><img class="ico g" src="assets/g/back.png" alt="">Назад</a>
    <a class="tab" href="shop.html" aria-current="page"><img class="ico nav3d" src="assets/cart.png" alt="">Магазин</a>
    <button class="tab"><img class="ico g" src="assets/g/receipt.png" alt="">Покупки</button>
  </nav>
</div></div>
</main>
<script src="shell.js"></script>
</body>
</html>
