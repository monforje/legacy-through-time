<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Колесо фортуны</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap">
<link rel="stylesheet" href="kit.css">
</head>
<body>
<div class="device"><div class="safe" data-attempts="1" data-wheel='[{"id":"coin-50","label":"50 монет","weight":29.59},{"id":"energy-1","label":"1 энергия","weight":4.3},{"id":"gem-3","label":"3 алмаза","weight":19},{"id":"coin-100","label":"100 монет","weight":19},{"id":"gift","label":"Подарок","weight":19},{"id":"gem-10","label":"10 алмазов","weight":4.5},{"id":"gem-25","label":"25 алмазов","weight":2.3},{"id":"energy-3","label":"3 энергии","weight":1.1},{"id":"gem-50","label":"50 алмазов","weight":0.76},{"id":"gem-150","label":"150 алмазов","weight":0.45}]'>
  <div class="modal-head">
    <h1 class="title">Колесо фортуны</h1>
    <a class="btn btn-icon" href="home.html" aria-label="Закрыть"><svg class="ico"><use href="icons.svg#i-close"/></svg></a>
  </div>

  <div class="scroll">
    <div class="prizes" aria-label="Призы и шансы">
      <div class="prize"><svg class="ico"><use href="icons.svg#i-coin"/></svg><b>50</b>29%</div>
      <div class="prize"><svg class="ico"><use href="icons.svg#i-energy"/></svg><b>1</b>4,3%</div>
      <div class="prize"><svg class="ico"><use href="icons.svg#i-gem"/></svg><b>3</b>19%</div>
      <div class="prize"><svg class="ico"><use href="icons.svg#i-coin"/></svg><b>100</b>19%</div>
      <div class="prize"><svg class="ico"><use href="icons.svg#i-gift"/></svg><b>&nbsp;</b>19%</div>
      <div class="prize"><svg class="ico"><use href="icons.svg#i-gem"/></svg><b>10</b>4,5%</div>
      <div class="prize"><svg class="ico"><use href="icons.svg#i-gem"/></svg><b>25</b>2,3%</div>
      <div class="prize"><svg class="ico"><use href="icons.svg#i-energy"/></svg><b>3</b>1,1%</div>
      <div class="prize"><svg class="ico"><use href="icons.svg#i-gem"/></svg><b>50</b>0,76%</div>
      <div class="prize"><svg class="ico"><use href="icons.svg#i-gem"/></svg><b>150</b>0,45%</div>
    </div>

    <div class="wheel" data-audit-skip>
      <div class="wheel-pointer"></div>
      <div class="wheel-disc">
        <div class="seg" style="--i:0"><svg class="ico"><use href="icons.svg#i-coin"/></svg><span class="n">50</span></div>
        <div class="seg" style="--i:1"><svg class="ico"><use href="icons.svg#i-energy"/></svg><span class="n">1</span></div>
        <div class="seg" style="--i:2"><svg class="ico"><use href="icons.svg#i-gem"/></svg><span class="n">3</span></div>
        <div class="seg" style="--i:3"><svg class="ico"><use href="icons.svg#i-coin"/></svg><span class="n">100</span></div>
        <div class="seg" style="--i:4"><svg class="ico"><use href="icons.svg#i-gift"/></svg><span class="n"></span></div>
        <div class="seg" style="--i:5"><svg class="ico"><use href="icons.svg#i-gem"/></svg><span class="n">10</span></div>
        <div class="seg" style="--i:6"><svg class="ico"><use href="icons.svg#i-gem"/></svg><span class="n">25</span></div>
        <div class="seg" style="--i:7"><svg class="ico"><use href="icons.svg#i-energy"/></svg><span class="n">3</span></div>
        <div class="seg" style="--i:8"><svg class="ico"><use href="icons.svg#i-gem"/></svg><span class="n">50</span></div>
        <div class="seg" style="--i:9"><svg class="ico"><use href="icons.svg#i-gem"/></svg><span class="n">150</span></div>
      </div>
      <div class="wheel-hub"><svg class="ico"><use href="icons.svg#i-star"/></svg></div>
    </div>

    <div class="topbar">
      <a class="btn btn-icon btn-primary" href="shop.html" aria-label="Купить попытки"><svg class="ico"><use href="icons.svg#i-plus"/></svg></a>
      <span class="head"><svg class="ico-s" style="vertical-align:-2px"><use href="icons.svg#i-wheel"/></svg> <span data-attempts>1 попытка</span></span>
    </div>
    <button class="btn btn-primary btn-block" data-spin>Вращать колесо</button>
    <button class="btn btn-secondary btn-block">Удвоить шансы на редкие призы за 150 <svg class="ico"><use href="icons.svg#i-gem"/></svg></button>
  </div>

  <div class="toast" hidden role="status"></div>
  <nav class="tabbar">
    <a class="tab" href="home.html"><svg class="ico"><use href="icons.svg#i-book"/></svg>Истории</a>
    <a class="tab" href="chat.html"><svg class="ico"><use href="icons.svg#i-chat"/></svg>Чат</a>
    <a class="tab" href="wheel.html" aria-current="page"><svg class="ico"><use href="icons.svg#i-wheel"/></svg>Колесо</a>
    <a class="tab" href="library.html"><svg class="ico"><use href="icons.svg#i-star"/></svg>Слова</a>
    <a class="tab" href="rewards.html"><svg class="ico"><use href="icons.svg#i-gift"/></svg>Награды</a>
  </nav>
</div></div>
<script src="shell.js"></script>
</body>
</html>
