<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Колесо фортуны</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap">
<link rel="stylesheet" href="kit.css">
</head>
<body>
<div class="device">
  <iframe class="bg" src="home.html" title="Главная" aria-hidden="true" tabindex="-1" inert></iframe>
  <div class="dim soft"></div>
  <dialog open class="modal popup" aria-labelledby="wheel-title" data-attempts="1" data-wheel='[{"id":"coin-50","label":"50 монет","weight":29.59},{"id":"energy-1","label":"1 энергия","weight":4.3},{"id":"gem-3","label":"3 алмаза","weight":19},{"id":"coin-100","label":"100 монет","weight":19},{"id":"gift","label":"Подарок","weight":19},{"id":"gem-10","label":"10 алмазов","weight":4.5},{"id":"gem-25","label":"25 алмазов","weight":2.3},{"id":"energy-3","label":"3 энергии","weight":1.1},{"id":"gem-50","label":"50 алмазов","weight":0.76},{"id":"gem-150","label":"150 алмазов","weight":0.45}]'>
  <div class="modal-head">
    <h1 class="title" id="wheel-title">Колесо фортуны</h1>
    <a class="btn btn-icon" href="home.html" data-back aria-label="Закрыть"><img class="ico g" src="assets/g/close.png" alt=""></a>
  </div>

  <div class="scroll">
    <div class="prizes" aria-label="Призы и шансы">
      <div class="prize"><span class="token t-coin"><img src="assets/coin.png" alt=""><b>50</b></span><span>29%</span></div>
      <div class="prize"><span class="token t-energy"><img src="assets/energy.png" alt=""><b>1</b></span><span>4,3%</span></div>
      <div class="prize"><span class="token t-gem"><img src="assets/gem.png" alt=""><b>3</b></span><span>19%</span></div>
      <div class="prize"><span class="token t-coin"><img src="assets/coin.png" alt=""><b>100</b></span><span>19%</span></div>
      <div class="prize"><span class="token t-gift"><img src="assets/gift.png" alt=""></span><span>19%</span></div>
      <div class="prize"><span class="token t-gem"><img src="assets/gem.png" alt=""><b>10</b></span><span>4,5%</span></div>
      <div class="prize"><span class="token t-gem"><img src="assets/gem.png" alt=""><b>25</b></span><span>2,3%</span></div>
      <div class="prize"><span class="token t-energy"><img src="assets/energy.png" alt=""><b>3</b></span><span>1,1%</span></div>
      <div class="prize"><span class="token t-gem"><img src="assets/gem.png" alt=""><b>50</b></span><span>0,76%</span></div>
      <div class="prize"><span class="token t-gem"><img src="assets/gem.png" alt=""><b>150</b></span><span>0,45%</span></div>
    </div>

    <div class="wheel" data-audit-skip>
      <div class="wheel-disc">
        <div class="seg" style="--i:0"><span class="tile t-coin"><img src="assets/coin.png" alt=""></span></div>
        <div class="seg" style="--i:1"><span class="tile t-energy"><img src="assets/energy.png" alt=""></span></div>
        <div class="seg" style="--i:2"><span class="tile t-gem"><img src="assets/gem.png" alt=""></span></div>
        <div class="seg" style="--i:3"><span class="tile t-coin"><img src="assets/coin.png" alt=""></span></div>
        <div class="seg" style="--i:4"><span class="tile t-gift"><img src="assets/gift.png" alt=""></span></div>
        <div class="seg" style="--i:5"><span class="tile t-gem"><img src="assets/gem.png" alt=""></span></div>
        <div class="seg" style="--i:6"><span class="tile t-gem"><img src="assets/gem.png" alt=""></span></div>
        <div class="seg" style="--i:7"><span class="tile t-energy"><img src="assets/energy.png" alt=""></span></div>
        <div class="seg" style="--i:8"><span class="tile t-gem"><img src="assets/gem.png" alt=""></span></div>
        <div class="seg" style="--i:9"><span class="tile t-gem"><img src="assets/gem.png" alt=""></span></div>
      </div>
      <div class="wheel-active"></div>
      <div class="wheel-mark"></div>
      <div class="wheel-hub"><img class="ico-3d" src="assets/star.png" alt=""></div>
    </div>

    <div class="topbar">
      <a class="btn btn-icon btn-primary btn-sq" href="shop.html" aria-label="Купить попытки"><img class="ico g" src="assets/g/plus-ink.png" alt=""></a>
      <span class="head" style="display:inline-flex;align-items:center;gap:var(--space-2)" role="img" aria-label="Попытки"><img class="ico nav3d" src="assets/wheel.png" alt=""><span data-attempts>1</span></span>
    </div>
    <button class="btn btn-primary btn-split btn-block" data-spin><span>Вращать колесо</span><span class="tail"><img class="ico nav3d" src="assets/wheel.png" alt=""><span data-attempts>1</span></span></button>
    <button class="btn btn-split btn-block"><span>Удвоить шансы на редкие призы</span><span class="tail"><img class="ico-3d" src="assets/gem.png" alt="">150</span></button>
  </div>

  <div class="toast" hidden role="status"></div>
</dialog>
</div>
<script src="shell.js"></script>
</body>
</html>
