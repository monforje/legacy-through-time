<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Настройки</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap">
<link rel="stylesheet" href="kit.css">
</head>
<body>
<div class="device"><div class="safe">
  <div class="modal-head">
    <h1 class="title">Настройки</h1>
    <a class="btn btn-icon" href="home.html" data-back aria-label="Закрыть"><svg class="ico"><use href="icons.svg#i-close"/></svg></a>
  </div>

  <div class="scroll">
    <div class="group">
      <div class="row"><svg class="ico"><use href="icons.svg#i-bell"/></svg><span class="label">Уведомления</span><button class="switch" role="switch" aria-checked="true" aria-label="Уведомления"></button></div>
      <div class="row"><svg class="ico"><use href="icons.svg#i-sound"/></svg><span class="label">Звук</span><button class="switch" role="switch" aria-checked="true" aria-label="Звук"></button></div>
      <div class="row"><svg class="ico"><use href="icons.svg#i-globe"/></svg><span class="label">Язык</span>
        <span class="stepper" data-values="Русский|English"><button aria-label="Предыдущий язык"><svg class="ico"><use href="icons.svg#i-chevron-l"/></svg></button><output>Русский</output><button aria-label="Следующий язык"><svg class="ico"><use href="icons.svg#i-chevron-r"/></svg></button></span></div>
    </div>

    <div class="group" style="padding:var(--space-3);gap:var(--space-2)">
      <p class="small" style="text-align:center">Войдите, чтобы прогресс сохранялся в облаке</p>
      <button class="btn btn-login btn-block">Войти с почтой</button>
      <button class="btn btn-login btn-block">Войти через Google</button>
      <button class="btn btn-login btn-block">Войти через Apple</button>
    </div>

    <div class="group">
      <button class="row"><svg class="ico"><use href="icons.svg#i-support"/></svg><span class="label">Поддержка</span><svg class="ico"><use href="icons.svg#i-chevron-r"/></svg></button>
      <button class="row"><svg class="ico"><use href="icons.svg#i-shield"/></svg><span class="label">Конфиденциальность</span><svg class="ico"><use href="icons.svg#i-chevron-r"/></svg></button>
      <button class="row"><svg class="ico"><use href="icons.svg#i-doc"/></svg><span class="label">Пользовательское соглашение</span><svg class="ico"><use href="icons.svg#i-chevron-r"/></svg></button>
      <button class="row"><svg class="ico"><use href="icons.svg#i-tools"/></svg><span class="label">Инструменты</span><svg class="ico"><use href="icons.svg#i-chevron-r"/></svg></button>
    </div>
  </div>
  <div class="toast" id="saved" role="status" hidden></div>
</div></div>
<script src="shell.js"></script>
</body>
</html>
