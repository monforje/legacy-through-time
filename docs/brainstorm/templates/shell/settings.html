<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Настройки</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap">
<link rel="stylesheet" href="kit.css">
</head>
<body>
<div class="device"><div class="safe">
  <div class="modal-head">
    <h1 class="title">Настройки</h1>
    <a class="btn btn-icon" href="home.html" data-back aria-label="Закрыть"><img class="ico g" src="assets/g/close.png" alt=""></a>
  </div>

  <div class="scroll">
    <div class="group">
      <div class="row"><img class="ico g" src="assets/g/bell.png" alt=""><span class="label">Уведомления</span><button class="switch" role="switch" aria-checked="true" aria-label="Уведомления"></button></div>
      <div class="row"><img class="ico g" src="assets/g/sound.png" alt=""><span class="label">Звук</span><button class="switch" role="switch" aria-checked="true" aria-label="Звук"></button></div>
      <div class="row"><img class="ico g" src="assets/g/globe.png" alt=""><span class="label">Язык</span>
        <span class="stepper" data-values="Русский|English"><button aria-label="Предыдущий язык"><img class="ico g" src="assets/g/chevron-l.png" alt=""></button><output>Русский</output><button aria-label="Следующий язык"><img class="ico g" src="assets/g/chevron-r.png" alt=""></button></span></div>
    </div>

    <div class="group" style="padding:var(--space-3);gap:var(--space-2)">
      <p class="small" style="text-align:center">Войдите, чтобы прогресс сохранялся в облаке</p>
      <button class="btn btn-login btn-block">Войти с почтой</button>
      <button class="btn btn-login btn-block">Войти через Google</button>
      <button class="btn btn-login btn-block">Войти через Apple</button>
    </div>

    <div class="group">
      <button class="row"><img class="ico g" src="assets/g/support.png" alt=""><span class="label">Поддержка</span><img class="ico g" src="assets/g/chevron-r.png" alt=""></button>
      <button class="row"><img class="ico g" src="assets/g/shield.png" alt=""><span class="label">Конфиденциальность</span><img class="ico g" src="assets/g/chevron-r.png" alt=""></button>
      <button class="row"><img class="ico g" src="assets/g/doc.png" alt=""><span class="label">Пользовательское соглашение</span><img class="ico g" src="assets/g/chevron-r.png" alt=""></button>
      <button class="row"><img class="ico g" src="assets/g/tools.png" alt=""><span class="label">Инструменты</span><img class="ico g" src="assets/g/chevron-r.png" alt=""></button>
    </div>
  </div>
  <div class="toast" id="saved" role="status" hidden></div>
</div></div>
<script src="shell.js"></script>
</body>
</html>
