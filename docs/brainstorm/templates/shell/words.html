<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Слова по историям</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap">
<link rel="stylesheet" href="kit.css">
</head>
<body style="display:block">
<main data-screen-demo style="width:360px;max-width:100%;margin:0 auto">
  <!-- Переключатель состояний только для макета, в приложении его нет -->
  <div class="demo" role="group" aria-label="Состояние экрана">
    <button class="chip" data-set="normal" aria-pressed="true">Список</button>
    <button class="chip" data-set="empty" aria-pressed="false">Пусто</button>
  </div>


<div class="device"><div class="safe">
  <h1 class="title" style="padding:var(--space-2) 0">Слова</h1>
  <p class="small" style="text-align:center">Слова и понятия по историям</p>

  <div class="scroll" style="margin-top:var(--space-3)">
    <div class="list" data-stagger data-s="normal">
      <a class="list-row" href="library.html?story=lighthouse">
        <span class="thumb" style="background:var(--art-5)" aria-hidden="true"></span>
        <span class="who"><span class="head">Последний маяк</span><span class="small clamp1">Открыто 3 из 12</span></span>
        <img class="ico chev-end g" src="assets/g/chevron-r.png" alt="">
      </a>
      <a class="list-row" href="library.html?story=cage">
        <span class="thumb" style="background:var(--art-8)" aria-hidden="true"></span>
        <span class="who"><span class="head">Золотая клетка</span><span class="small clamp1">Открыто 7 из 20</span></span>
        <img class="ico chev-end g" src="assets/g/chevron-r.png" alt="">
      </a>
      <a class="list-row" href="library.html?story=city">
        <span class="thumb" style="background:var(--art-2)" aria-hidden="true"></span>
        <span class="who"><span class="head">Город под водой</span><span class="small clamp1">Открыто 1 из 9</span></span>
        <img class="ico chev-end g" src="assets/g/chevron-r.png" alt="">
      </a>
    </div>
    <div class="state-box" data-s="empty" hidden>
      <img class="ico-3d float" src="assets/book.png" alt="">
      <div class="head">Слов пока нет</div>
      <p class="small">Они появятся, когда вы начнёте читать историю</p>
      <a class="btn btn-primary" href="home.html">К историям</a>
    </div>
  </div>

  <nav class="tabbar">
    <a class="tab" href="home.html"><img class="ico nav3d" src="assets/book.png" alt="">Истории</a>
    <a class="tab" href="chats.html"><img class="ico nav3d" src="assets/chat.png" alt="">Чат</a>
    <a class="tab" href="wheel.html"><img class="ico nav3d" src="assets/wheel.png" alt="">Колесо</a>
    <a class="tab" href="words.html" aria-current="page"><img class="ico nav3d" src="assets/star.png" alt="">Слова</a>
    <a class="tab" href="rewards.html"><img class="ico nav3d" src="assets/gift.png" alt="">Награды</a>
  </nav>
</div></div>
</main>
<script src="shell.js"></script>
</body>
</html>
