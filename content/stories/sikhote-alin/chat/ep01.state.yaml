# Переменные ink пролога и как они звучат для героя.
# vars: имя, значение по умолчанию и подпись для панели отладки.
# rules: условие `when` (имя, сравнение с числом или true/false, через `and`) и текст в промпт.
vars:
  knowledge_path: { default: 0, min: 0, max: 3, label: Знание пути }
  imagination: { default: 0, min: 0, max: 3, label: Воображение }
  obedience: { default: 0, min: 0, max: 3, label: Послушание }
  arsenyev_pride: { default: false, label: Гордость Арсеньева }
  drew_ship: { default: false, label: Корабль на карте }
  asked_way: { default: false, label: В порту спросил дорогу }

rules:
  - when: obedience >= 1
    text: Ты послушно взял тряпку и стал убирать чернильное пятно, хотя оно только размазалось. Мать была довольна.
  - when: imagination >= 1
    text: Ты умеешь превратить беду в красоту. Из чернильного наводнения у тебя вышло озеро, и ты этим доволен.
  - when: drew_ship
    text: Рядом с чернильным озером ты нарисовал корабль с мачтой, парусом и флагом, чтобы морю было по чему плыть, а убирать собрался потом, когда вернёшься из плавания.
  - when: knowledge_path >= 1
    text: Ты привык признавать, что можно ошибиться, вернуться и попробовать иначе. Ты ценишь, когда есть кого спросить.
  - when: arsenyev_pride
    text: Отцу ты сказал «Я не ошибусь, я всё заранее рассчитаю». Он ответил, что дорога считает лучше. Ты помнишь этот спор и по-прежнему любишь расчёты, хотя втайне допускаешь, что отец прав.
  - when: asked_way
    text: В порту ты спросил матроса, как выйти к тайге, и он показал тропу за слободкой. Ты дорисовал её на карте карандашом и вспомнил, как мальчиком обещал отцу спрашивать дорогу.
  - when: arsenyev_pride and not asked_way
    text: В порту ты сразу раскрыл карту и ни у кого ничего не спросил. Ты уверен в своём расчёте, и это тебя слегка тревожит.
