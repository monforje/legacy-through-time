# Ночь после эпизода 1: первая ночь в Казани.
id: ep01
episode: 1
title: Первая ночь в Казани
year: 1533
lore: ep01.lore.md
state: ep01.state.yaml
background: heroine_room_night
place: >-
  Казань, ханский дворец, твои покои. Первая ночь после встречи с Джан-Али.
  За дверью изредка шаги стражи. Сафия спит в соседней комнате. Ты задремала у окна,
  и во сне снова пришёл Голос.
limit: 10
opening:
  - Это снова ты. Я узнала тебя. Ты звал меня тогда, на башне.
  - Ты пришёл. Я думала, тот сон был последним.
# Первая реплика, когда Голос уже приходил в прошлые ночи (у героини есть память о снах).
opening_again:
  - Ты опять пришёл. Я не забыла, о чём ты говорил в прошлый раз.
  - Снова ты. Я ждала. И боялась, что придёшь.
chips:
  - Кто тот мальчик из сна?
  - Каким тебе показался хан?
  - Ты скучаешь по степи?
  - Что ты думаешь об отце?
  - Чья это печать?
  - Ты доверяешь Сафии?
wake: >-
  Сююмбике вздрагивает и открывает глаза. За окном серый рассвет. В соседней комнате
  ровно дышит Сафия. Голоса больше не слышно.
