version: "3"

vars:
  UNITY: "{{.UNITY_EDITOR | default (print .HOME \"/Unity/Hub/Editor/6000.6.3f1/Editor/Unity\")}}"
  ADB: "{{.HOME}}/Unity/Hub/Editor/6000.6.3f1/Editor/Data/PlaybackEngines/AndroidPlayer/SDK/platform-tools/adb"
  APP_ID: com.dan.legacythroughtime
  INK_IMAGE: legacy-through-time/inklecate
  DOTNET_IMAGE: legacy-through-time/dotnet
  SVG_IMAGE: legacy-through-time/svg
  QR_IMAGE: legacy-through-time/qr
  OXIPNG_IMAGE: legacy-through-time/oxipng
  REPO: monforje/legacy-through-time
  APK_ASSET: game.apk
  HERITAGE_DIR: docs/brainstorm/templates/assets/heritage
  DOTNET: docker run --rm --user "$(id -u):$(id -g)" -e NUGET_PACKAGES=/work/.cache/nuget -v "{{.ROOT_DIR}}:/work" {{.DOTNET_IMAGE}}

tasks:
  ink:
    desc: Compile Ink stories content/stories/<story>/<episode>.ink -> buckets/stories/<story>/<episode>.json
    vars:
      # Root stories only: skip any .ink whose file name appears in an INCLUDE line.
      INK_ROOTS:
        sh: |
          inc=$(grep -rhoE '^[[:space:]]*INCLUDE[[:space:]]+.+' content/stories --include='*.ink' | sed -E 's/^[[:space:]]*INCLUDE[[:space:]]+//; s/[[:space:]]+$//; s#.*/##' || true)
          find content/stories -name '*.ink' | while IFS= read -r f; do
            printf '%s\n' "$inc" | grep -qxF "$(basename "$f")" || echo "$f"
          done
    deps: [ink-image]
    sources: ["content/stories/**/*.ink"]
    generates: ["buckets/stories/**/*.json"]
    cmds:
      - for: { var: INK_ROOTS, split: "\n" }
        cmd: |
          out="buckets/{{.ITEM | trimPrefix "content/" | trimSuffix ".ink"}}.json"
          mkdir -p "$(dirname "$out")"
          docker run --rm --user "$(id -u):$(id -g)" -v "{{.ROOT_DIR}}:/work" {{.INK_IMAGE}} -o "$out" "{{.ITEM}}"

  ink-image:
    internal: true
    sources: [docker/inklecate/Dockerfile]
    status: ["docker image inspect {{.INK_IMAGE}} >/dev/null 2>&1"]
    cmds: ["docker build -t {{.INK_IMAGE}} docker/inklecate"]

  test:
    desc: Narrative engine tests — differential vs the official ink runtime, machine properties, save/load
    deps: [dotnet-image]
    cmds:
      - mkdir -p .cache/nuget
      - "{{.DOTNET}} dotnet test Tests/Narrative --nologo -v q"

  test:reader:
    desc: Reading-screen logic tests (layout, text rules, plate skins, story -> screen mapping) - no Unity needed
    deps: [dotnet-image]
    cmds:
      - mkdir -p .cache/nuget
      - "{{.DOTNET}} dotnet test Tests/Reader --nologo -v q"

  bench:
    desc: Narrative engine vs official ink runtime on the real episode (time and allocations per line)
    deps: [dotnet-image]
    cmds:
      - mkdir -p .cache/nuget
      - "{{.DOTNET}} dotnet test Tests/Narrative -c Release --nologo -v q --filter Category=Benchmark --logger 'console;verbosity=detailed' | grep -E 'ms/op' | sort -u"

  dotnet-image:
    internal: true
    deps: [ink-image]
    sources: [docker/dotnet/Dockerfile]
    status: ["docker image inspect {{.DOTNET_IMAGE}} >/dev/null 2>&1"]
    cmds: ["docker build -t {{.DOTNET_IMAGE}} docker/dotnet"]

  mockups:
    desc: Serve HTML mockups docs/brainstorm/templates on http://localhost:8080 (stop with `docker stop ltt-mockups`)
    cmds:
      - docker rm -f ltt-mockups >/dev/null 2>&1 || true
      - docker run -d --rm --name ltt-mockups --user "$(id -u):$(id -g)" -p 8080:8080 -v "{{.ROOT_DIR}}/docs/brainstorm/templates:/www:ro" -w /www python:3.13-alpine python _serve.py >/dev/null
      - echo "http://localhost:8080/"

  png:optimize:
    desc: Lossless PNG recompression (oxipng, metadata stripped) for everything under Assets/ (or DIR=...)
    cmds:
      - docker image inspect {{.OXIPNG_IMAGE}} >/dev/null 2>&1 || docker build -t {{.OXIPNG_IMAGE}} docker/oxipng
      - docker run --rm --user "$(id -u):$(id -g)" -v "{{.ROOT_DIR}}:/work" {{.OXIPNG_IMAGE}} -o 4 --strip safe -r {{.DIR | default "Assets"}}

  assets:png:
    desc: Heritage UI - regenerate SVG (build.py) and export @4x PNG + manifest.json (9-slice borders) -> docs/brainstorm/templates/assets/heritage/png
    deps: [svg-image]
    sources: ["{{.HERITAGE_DIR}}/build.py", "{{.HERITAGE_DIR}}/kit/**/*.py", "{{.HERITAGE_DIR}}/sprites/**/*.py"]
    generates: ["{{.HERITAGE_DIR}}/png/*.png", "{{.HERITAGE_DIR}}/manifest.json"]
    cmds:
      - |
        docker run --rm --user "$(id -u):$(id -g)" -v "{{.ROOT_DIR}}:/work" -w /work/{{.HERITAGE_DIR}} {{.SVG_IMAGE}} sh -c '
          python3 build.py && rm -rf png && mkdir png &&
          for f in *.svg; do rsvg-convert -z 4 "$f" -o "png/${f%.svg}.png"; done'

  assets:unity:
    desc: Heritage UI - export PNG and copy them with slices.txt into Assets/Resources/Heritage (borders are applied by the importer)
    deps: ["assets:png"]
    cmds:
      - mkdir -p Assets/Resources/Heritage
      - rm -f Assets/Resources/Heritage/*.png
      - cp {{.HERITAGE_DIR}}/png/*.png {{.HERITAGE_DIR}}/slices.txt Assets/Resources/Heritage/
      - task: png:optimize
        vars: { DIR: Assets/Resources/Heritage }

  assets:brand:
    desc: Brand art - launcher icon layers (adaptive, round, legacy) -> Assets/Art/Brand, loading-screen logo -> Assets/Resources/Brand
    deps: [svg-image]
    cmds:
      - mkdir -p Assets/Art/Brand Assets/Resources/Brand
      - |
        docker run --rm --user "$(id -u):$(id -g)" -v "{{.ROOT_DIR}}:/work" -w /work/{{.HERITAGE_DIR}}/brand {{.SVG_IMAGE}} sh -c '
          for n in icon-bg icon-fg icon-legacy icon-round; do rsvg-convert "$n.svg" -o "/work/Assets/Art/Brand/$n.png"; done'
      - cp {{.HERITAGE_DIR}}/brand/logo.png Assets/Resources/Brand/logo.png

  assets:test:
    desc: Heritage UI generator tests - SVGs well-formed, borders inside sprites, output reproducible, files up to date
    deps: [svg-image]
    cmds:
      - docker run --rm --user "$(id -u):$(id -g)" -v "{{.ROOT_DIR}}:/work" -w /work/{{.HERITAGE_DIR}} {{.SVG_IMAGE}} python3 -B -m unittest discover -s tests

  assets:fonts:
    desc: Download Russo One / Rubik / Nunito and cut static weights -> Assets/Resources/Fonts
    deps: [svg-image]
    cmds:
      - docker run --rm --user "$(id -u):$(id -g)" -v "{{.ROOT_DIR}}:/work" {{.SVG_IMAGE}} python3 docker/svg/fonts.py Assets/Resources/Fonts

  svg-image:
    internal: true
    sources: [docker/svg/Dockerfile]
    status: ["docker image inspect {{.SVG_IMAGE}} >/dev/null 2>&1"]
    cmds: ["docker build -t {{.SVG_IMAGE}} docker/svg"]

  prototype:smoke:
    desc: Build every heritage prototype screen in batchmode (no Play Mode) and report exceptions / missing assets
    preconditions:
      - sh: test ! -e Temp/UnityLockfile
        msg: "Unity Editor has this project open. Close it first."
    cmds:
      - "{{.UNITY}} -batchmode -nographics -quit -projectPath . -executeMethod LegacyThroughTime.Editor.PrototypeSmoke.Run -logFile - | grep -E '\\[smoke\\]|error CS|Exception|rror:' || true"

  prototype:play:
    desc: Play the heritage prototype with synthetic taps in batchmode (PlayMode test) -> Temp/prototype-play.xml
    preconditions:
      - sh: test ! -e Temp/UnityLockfile
        msg: "Unity Editor has this project open (or a crashed batch run left Temp/UnityLockfile). Close the editor first."
    cmds:
      - "{{.UNITY}} -batchmode -nographics -projectPath . -runTests -testPlatform PlayMode -assemblyNames LegacyThroughTime.PrototypeTests -testResults {{.ROOT_DIR}}/Temp/prototype-play.xml -logFile Temp/prototype-play.log > /dev/null || true"
      - grep -oE 'result="[A-Za-z()]+" total="[0-9]+" passed="[0-9]+" failed="[0-9]+"' Temp/prototype-play.xml | head -1

  story:play:
    desc: Play the whole episode 1 on the heritage screens with synthetic taps in batchmode (PlayMode test) -> Temp/story-play.xml
    deps: [ink]
    preconditions:
      - sh: test ! -e Temp/UnityLockfile
        msg: "Unity Editor has this project open (or a crashed batch run left Temp/UnityLockfile). Close the editor first."
    cmds:
      - mkdir -p Assets/StreamingAssets/stories/golden-cage
      - cp buckets/stories/golden-cage/episode-01.json Assets/StreamingAssets/stories/golden-cage/
      - "{{.UNITY}} -batchmode -nographics -projectPath . -runTests -testPlatform PlayMode -assemblyNames LegacyThroughTime.PrototypeTests -testFilter StoryWalkThrough -testResults {{.ROOT_DIR}}/Temp/story-play.xml -logFile Temp/story-play.log > /dev/null || true"
      - grep -oE 'result="[A-Za-z()]+" total="[0-9]+" passed="[0-9]+" failed="[0-9]+"' Temp/story-play.xml | head -1

  apk:
    desc: Dev APK (IL2CPP debug C++, fastest to build) -> Builds/Android/game-dev.apk
    deps: [ink]
    cmds:
      - task: unity
        vars: { METHOD: Dev }

  release:
    desc: Release APK -> Builds/Android/game.apk
    deps: [ink]
    cmds:
      - task: unity
        vars: { METHOD: Release }

  qr:
    desc: QR code -> Builds/qr.png; the link always serves the APK of the latest GitHub release (the QR never changes). Override with URL=...
    deps: [qr-image]
    vars:
      LINK: '{{.URL | default (print "https://github.com/" .REPO "/releases/latest/download/" .APK_ASSET)}}'
    cmds:
      - docker run --rm --user "$(id -u):$(id -g)" -v "{{.ROOT_DIR}}:/work" {{.QR_IMAGE}} -s 16 -m 2 -o Builds/qr.png "{{.LINK}}"
      - echo "{{.LINK}} -> Builds/qr.png"

  publish:
    desc: Upload Builds/Android/game.apk as a new release of the repo (the QR from `task qr` then serves it)
    preconditions:
      - { sh: "test -f Builds/Android/{{.APK_ASSET}}", msg: "no APK - run `task release` first" }
    vars:
      TAG: '{{.TAG | default (now | date "2006-01-02-1504")}}'
    cmds:
      - gh release create "{{.TAG}}" "Builds/Android/{{.APK_ASSET}}" --repo {{.REPO}} --title "{{.TAG}}" --notes "Android build"

  qr-image:
    internal: true
    sources: [docker/qr/Dockerfile]
    status: ["docker image inspect {{.QR_IMAGE}} >/dev/null 2>&1"]
    cmds: ["docker build -t {{.QR_IMAGE}} docker/qr"]

  install:
    desc: Install the dev APK on the connected phone and launch it
    cmds:
      - "{{.ADB}} install -r Builds/Android/game-dev.apk"
      - "{{.ADB}} shell monkey -p {{.APP_ID}} -c android.intent.category.LAUNCHER 1 >/dev/null"

  unity:
    internal: true
    preconditions:
      - sh: test ! -e Temp/UnityLockfile
        msg: "Unity Editor has this project open. Close it, or use the Build menu inside the editor."
    cmds:
      - "{{.UNITY}} -batchmode -nographics -quit -projectPath . -buildTarget Android -executeMethod LegacyThroughTime.Editor.AndroidBuild.{{.METHOD}} -logFile -"
